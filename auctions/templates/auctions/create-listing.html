{% extends "auctions/layout.html" %}

{% block body %}
<div class="create-listing-container">
  <div class="form-card">
    <h2 class="form-title">Create Listing</h2>
    <p class="form-subtitle">Fill out the details for your auction item</p>

    <form method="POST" enctype="multipart/form-data" action="{%url 'create_listing' %}">
      {% csrf_token %}

      <div class="form-grid">

        <div class="form-group">
          <label>Title</label>
          <input type="text" name="title" placeholder="Item title" required>
        </div>

        <div class="form-group">
          <label>Starting Bid</label>
          <input type="number" step="0.01" name="starting_bid" placeholder="0.00" required>
        </div>

        <div class="form-group full">
          <label>Description</label>
          <textarea name="description" rows="4" placeholder="Describe your item..." required></textarea>
        </div>

        <div class="form-group">
          <label>Image URL</label>
          <input type="url" name="image_url" placeholder="https://..." required>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select name="category" required>
            {% for category in category %}
              <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
          </select>
        </div>

      </div>

      <button type="submit" class="submit-btn">Create Listing</button>
    </form>
  </div>
</div>
{% endblock %}
